# Continuous integration workflow for SOCI Windows builds.
name: Windows CI

on:
  push:
    branches:
      - master
      - 'release/**'
    paths-ignore:
      - .circleci/**
      - .cirrus.yml
      - .github/workflows/ci.yml
      - .github/workflows/codeql.yml
      - appveyor.yml
  pull_request:
    branches:
      - master
    paths-ignore:
      - .circleci/**
      - .cirrus.yml
      - .github/workflows/ci.yml
      - .github/workflows/codeql.yml
      - appveyor.yml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib_type: shared
            build_type: Debug
            mssql_driver: ODBC Driver 17 for SQL Server
          - lib_type: shared
            build_type: Release
            unity_build: true
            mssql_driver: SQL Server
          - lib_type: static
            build_type: Release

    runs-on: windows-2022
    name: MSVS ${{ matrix.lib_type }} ${{ matrix.build_type }} ${{ matrix.unity_build && '(unity build)' || '' }} ${{ matrix.mssql_driver && format('with "{0}" ODBC driver', matrix.mssql_driver) || '' }}

    env:
      SOCI_CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Set up MSVS environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Set up PostgreSQL
        run: |
          $pgService = Get-Service -Name postgresql*
          Set-Service -InputObject $pgService -Status running -StartupType automatic
          Start-Process -FilePath "$env:PGBIN\pg_isready" -Wait
          & $env:PGBIN\createdb soci_test

      - name: Configure
        run: |
          $soci_shared = "${{ matrix.lib_type }}" -eq "shared" ? "ON" : "OFF"
          $soci_enable_unity_build = "${{ matrix.unity_build }}" -eq "true" ? "ON" : "OFF"
          cmake -S . -B build -GNinja `
            -DCMAKE_VERBOSE_MAKEFILE=ON `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_UNITY_BUILD=$soci_enable_unity_build `
            -DWITH_BOOST=OFF `
            -DSOCI_DB2=OFF `
            -DSOCI_FIREBIRD=OFF `
            -DSOCI_ORACLE=OFF `
            -DSOCI_SHARED=$soci_shared `
            -DSOCI_ENABLE_WERROR=ON

      - name: Build
        run: |
          cmake --build build

      # There is no SQL Server service on GitHub Windows runners, but LocalDB
      # is installed as part of MSVS, so use it. It is only accessible via a
      # named pipe, and old drivers don't understand "(localdb)\Instance"
      # syntax, so we need to find the pipe name and use it directly.
      #
      # Note that this must be done after building, as LocalDB shuts down
      # after being idle for a few minutes and its pipe name changes when it
      # is restarted, so the connection string could become invalid if we
      # determined it before the (potentially long) build.
      - name: Set up SQL Server LocalDB
        if: matrix.mssql_driver
        run: |
          Get-OdbcDriver -Platform 64-bit | Format-Table -Property Name

          sqllocaldb start MSSQLLocalDB
          $info = sqllocaldb info MSSQLLocalDB
          Write-Output $info
          # Note that "np:" prefix must be kept, at least the legacy "SQL
          # Server" driver doesn't recognize the pipe name without it.
          $m = $info | Select-String -Pattern 'pipe name:\s*(np:\S+)'
          if (-not $m) { throw "Failed to find LocalDB pipe name" }
          $pipe = $m.Matches[0].Groups[1].Value

          $connstr = "Driver={${{ matrix.mssql_driver }}};Server=$pipe;Trusted_Connection=yes"
          $conn = New-Object System.Data.Odbc.OdbcConnection "$connstr;Database=master"
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "CREATE DATABASE soci_test"
          $cmd.ExecuteNonQuery() | Out-Null
          $conn.Close()

          $connstr += ";Database=soci_test"
          "SOCI_MSSQL_CONNSTR=$connstr" >> $env:GITHUB_ENV

          # Update the connection string used by CTest: this doesn't rebuild
          # anything.
          cmake -S . -B build "-DSOCI_ODBC_TEST_MSSQL_CONNSTR:STRING=$connstr"

      - name: Test
        run: |
          # Only run ODBC MS SQL test if we have the database for it.
          $exclude = "soci_mysql_test|soci_odbc_test_(ms_access|mysql|postgresql)"
          if (-not $env:SOCI_MSSQL_CONNSTR) { $exclude += "|soci_odbc_test_mssql" }
          ctest --test-dir build -V --timeout 300 --output-on-failure --exclude-regex $exclude
